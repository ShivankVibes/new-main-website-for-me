<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1220;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .box {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      padding: 28px 24px;
      max-width: 520px;
      width: 100%;
    }

    .loader {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      animation: pulse 0.75s ease-in-out infinite alternate;
      margin-top: 18px;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(1.4); opacity: 0.6; }
    }

    a {
      color: #7dd3fc;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Redirecting...</h1>
    <p id="message">Checking your short link and tracking the click.</p>
    <div class="loader"></div>
    <p style="margin-top: 18px;"><a href="url-shortener.html">Back to URL shortener</a></p>
  </div>

  <script>
    const storageKey = 'url-shortener-links';
    const messageEl = document.getElementById('message');

    function readLinks() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || '[]');
      } catch {
        return [];
      }
    }

    function writeLinks(links) {
      localStorage.setItem(storageKey, JSON.stringify(links));
    }

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    const code = getQueryParam('code');
    if (!code) {
      messageEl.textContent = 'No short link code provided.';
    } else {
      const links = readLinks();
      const item = links.find((link) => link.code === code);
      if (!item) {
        messageEl.textContent = 'Link not found in this browser. Create it again from the URL shortener.';
      } else {
        item.clicks += 1;
        writeLinks(links);
        messageEl.textContent = `Redirecting to ${item.url}`;
        setTimeout(() => {
          window.location.href = item.url;
        }, 1200);
      }
    }
  </script>
</body>
</html>
