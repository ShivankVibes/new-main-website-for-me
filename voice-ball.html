<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Reactive Particle Sphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0d1117 0%, #000000 100%);
            font-family: 'Arial', sans-serif;
        }
        
        canvas {
            display: block;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
        }
        
        .info h1 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #00d4ff;
        }
        
        .info p {
            margin: 4px 0;
            font-size: 12px;
            opacity: 0.8;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }

        .mic-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #00d4ff;
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .mic-button:hover {
            background: #00ffff;
            transform: translateX(-50%) scale(1.05);
        }

        .mic-button.active {
            background: #ff0055;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 85, 0.8); }
        }

        .volume-meter {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            z-index: 10;
        }

        .volume-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ff0055);
            width: 0%;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
    <div id="loading">Click "Start Audio" to begin...</div>
    <div class="info" style="display:none;" id="info">
        <h1>🎤 Voice-Reactive Sphere</h1>
        <p>🔊 Speak or make sounds</p>
        <p>📢 Louder = bigger reaction</p>
        <p>⚡ Three.js + Web Audio API</p>
    </div>

    <button class="mic-button" id="micButton">🎤 Start Audio</button>
    <div class="volume-meter">
        <div class="volume-bar" id="volumeBar"></div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        
        // Audio setup
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let audioActive = false;

        const micButton = document.getElementById('micButton');
        const volumeBar = document.getElementById('volumeBar');

        micButton.addEventListener('click', async () => {
            if (!audioActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    
                    analyser.fftSize = 256;
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                    
                    microphone.connect(analyser);
                    
                    audioActive = true;
                    micButton.textContent = '🔴 Listening...';
                    micButton.classList.add('active');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('info').style.display = 'block';
                } catch (err) {
                    alert('Microphone access denied. Please allow microphone access.');
                    console.error('Error accessing microphone:', err);
                }
            }
        });

        function getAudioLevel() {
            if (!audioActive || !analyser) return 0;
            
            analyser.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;
            const normalized = average / 255;
            
            volumeBar.style.width = (normalized * 100) + '%';
            
            return normalized;
        }
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // Create particle sphere
        const particleCount = 2500;
        const geometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        const sizes = [];
        
        const radius = 2;
        
        for (let i = 0; i < particleCount; i++) {
            // Fibonacci sphere
            const phi = Math.acos(-1 + (2 * i) / particleCount);
            const theta = Math.sqrt(particleCount * Math.PI) * phi;
            
            const x = radius * Math.cos(theta) * Math.sin(phi);
            const y = radius * Math.sin(theta) * Math.sin(phi);
            const z = radius * Math.cos(phi);
            
            positions.push(x, y, z);
            
            // Gradient colors - vibrant cyan to purple
            const t = i / particleCount;
            colors.push(
                0.0 + t * 0.8,
                0.5 - t * 0.5,
                1.0 - t * 0.3
            );
            
            sizes.push(Math.random() * 1.5 + 0.5);
        }
        
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
        
        // Custom shader material for audio-reactive particles
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                audioLevel: { value: 0 }
            },
            vertexShader: `
                attribute vec3 color;
                attribute float size;
                varying vec3 vColor;
                varying float vIntensity;
                uniform float time;
                uniform float audioLevel;
                
                void main() {
                    vColor = color;
                    
                    vec3 pos = position;
                    
                    // Audio reactive pulsing - particles push INWARD when sound detected
                    float pulse = audioLevel * 0.4;
                    pos -= normalize(position) * pulse;  // Negative = inward
                    
                    // Wave effect based on audio
                    float wave = sin(time * 2.0 + length(position) * 3.0 + audioLevel * 10.0) * audioLevel * 0.2;
                    pos += normalize(position) * wave;
                    
                    vIntensity = audioLevel;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    float pointSize = size * (1.0 + audioLevel * 2.0);
                    gl_PointSize = pointSize * (50.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vIntensity;
                
                void main() {
                    vec2 center = gl_PointCoord - vec2(0.5);
                    float dist = length(center);
                    
                    if (dist > 0.5) discard;
                    
                    float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
                    alpha *= (0.5 + vIntensity * 0.5);
                    
                    vec3 finalColor = vColor * (1.0 + vIntensity * 1.0);
                    
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            blending: THREE.NormalBlending,
            depthWrite: false
        });
        
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
        
        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            
            // Get audio level
            const audioLevel = getAudioLevel();
            
            // Update shader uniforms
            material.uniforms.time.value = time;
            material.uniforms.audioLevel.value = audioLevel;
            
            // Rotate based on audio
            particles.rotation.y += 0.002 + audioLevel * 0.01;
            particles.rotation.x += 0.001 + audioLevel * 0.005;
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
